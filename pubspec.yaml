name: qianqian_growth_logbook
description: "芊芊成长日志 - Qianqian's Growth Logbook"
publish_to: 'none'
version: 2.2.0+4

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # 状态管理
  provider: ^6.1.2
  
  # 本地数据库
  sqflite: ^2.4.1
  path: ^1.9.0
  
  # 日历组件
  table_calendar: ^3.1.2
  
  # 图表库
  fl_chart: ^0.70.1
  
  # 日期处理
  intl: ^0.19.0
  
  # 本地通知
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  
  # 图片选择和相机
  image_picker: ^1.1.2
  
  # 文件存储
  path_provider: ^2.1.4
  
  # UUID生成
  uuid: ^4.5.1
  
  # 分享功能
  share_plus: ^10.1.4
  
  # 邮件/链接打开
  url_launcher: ^6.3.1
  
  # 本地存储
  shared_preferences: ^2.3.4
  
  # UI工具
  google_fonts: ^6.2.1
  
  # SVG支持
  flutter_svg: ^2.0.16
  sqflite_common_ffi: ^2.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/qq_glb_icon.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/qq_glb_icon.jpg"
  macos:
    generate: true
    image_path: "assets/icons/qq_glb_icon.jpg"
  web:
    generate: true
    image_path: "assets/icons/qq_glb_icon.jpg"
  windows:
    generate: true
    image_path: "assets/icons/qq_glb_icon.jpg"

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: MaShanZheng
      fonts:
        - asset: assets/fonts/MaShanZheng-Regular.ttf
